name: android-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Ensure platform + build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests - ramp shapes and phase totals
        run: gradle --no-daemon testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --console=plain

      - name: Report test results
        if: always()
        run: |
          find app/build/test-results -name '*.xml' -exec grep -H "<testsuite " {} \; | sed 's/ timestamp.*//' || true

      - uses: actions/upload-artifact@v4
        with:
          name: breathpacer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
