name: android-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships the Android SDK; just make sure the platform we compile
      # against is present. (android-actions/setup-android@v3 is unusable now - it calls
      # `sdkmanager tools`, a package that no longer exists in cmdline-tools 16.)
      - name: Ensure Android SDK packages
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests - ramp shapes and phase totals
        run: gradle --no-daemon testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --console=plain

      - name: Report test results
        if: always()
        run: |
          find app/build/test-results -name '*.xml' -exec grep -H "<testsuite " {} \; | sed 's/ timestamp.*//' || true

      - uses: actions/upload-artifact@v4
        with:
          name: breathpacer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
